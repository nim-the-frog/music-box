<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>music box</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0d0d0d;
      color: #ccc;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .box {
      width: 320px;
      height: 200px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 8px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lid {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 40px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
    }
    .keys {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .key {
      width: 40px;
      height: 120px;
      background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
      border: 2px solid #333;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.05s, background 0.05s;
      position: relative;
    }
    .key:active, .key.playing {
      transform: translateY(4px);
      background: linear-gradient(180deg, #3a3a3a 0%, #2a2a2a 100%);
    }
    .key::after {
      content: '';
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #666;
    }
    .key:nth-child(1)::after { content: 'C'; }
    .key:nth-child(2)::after { content: 'E'; }
    .key:nth-child(3)::after { content: 'G'; }
    .key:nth-child(4)::after { content: 'C\''; }
    .crank {
      position: absolute;
      right: -30px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border: 3px solid #444;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      transition: transform 0.1s;
    }
    .crank::before {
      content: '';
      width: 8px;
      height: 8px;
      border: 3px solid #444;
      border-radius: 50%;
      border-left-color: transparent;
      border-bottom-color: transparent;
    }
    .crank.spinning::before {
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .info {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #888;
    }
    .loops { font-family: monospace; }
    .status { margin-top: 8px; font-size: 12px; color: #666; }
    .hint { margin-top: 16px; font-size: 11px; color: #444; }
  </style>
</head>
<body>
  <div class="box">
    <div class="lid"></div>
    <div class="keys">
      <div class="key" data-freq="261.63"></div>
      <div class="key" data-freq="329.63"></div>
      <div class="key" data-freq="392.00"></div>
      <div class="key" data-freq="523.25"></div>
    </div>
    <div class="crank" id="crank"></div>
  </div>
  <div class="info">
    <div class="loops" id="loops">loops: 0</div>
    <div class="status" id="status">click crank to wind</div>
    <div class="hint">click keys to play manually</div>
  </div>
  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const keys = document.querySelectorAll('.key');
    const crank = document.getElementById('crank');
    const loopsEl = document.getElementById('loops');
    const status = document.getElementById('status');
    
    let isPlaying = false;
    let stopRequested = false;
    let loopCount = 0;
    
    const sequence = [
      { index: 0, delay: 0 },
      { index: 1, delay: 300 },
      { index: 2, delay: 300 },
      { index: 3, delay: 300 },
    ];
    
    function playNote(freq, duration) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration / 1000);
    }
    
    function highlightKey(i) {
      keys[i].classList.add('playing');
      setTimeout(() => keys[i].classList.remove('playing'), 250);
    }
    
    function playSequence() {
      return new Promise(resolve => {
        let step = 0;
        function next() {
          if (stopRequested || step >= sequence.length) {
            resolve(!stopRequested);
            return;
          }
          const { index, delay } = sequence[step];
          const freq = parseFloat(keys[index].dataset.freq);
          highlightKey(index);
          playNote(freq, 800);
          step++;
          setTimeout(next, delay);
        }
        next();
      });
    }
    
    async function runLoops() {
      crank.classList.add('spinning');
      status.textContent = 'playing... click crank to stop';
      
      while (!stopRequested) {
        const completed = await playSequence();
        if (!completed) break;
        loopCount++;
        loopsEl.textContent = `loops: ${loopCount}`;
        if (stopRequested) break;
        await new Promise(r => setTimeout(r, 200));
      }
      
      crank.classList.remove('spinning');
      status.textContent = stopRequested ? 'stopped. click to wind again' : 'finished';
      stopRequested = false;
      isPlaying = false;
    }
    
    crank.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      if (isPlaying) {
        stopRequested = true;
      } else {
        isPlaying = true;
        stopRequested = false;
        loopCount = 0;
        loopsEl.textContent = 'loops: 0';
        runLoops();
      }
    });
    
    keys.forEach((key, i) => {
      key.addEventListener('click', () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const freq = parseFloat(key.dataset.freq);
        highlightKey(i);
        playNote(freq, 800);
      });
    });
  </script>
</body>
</html>
