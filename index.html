<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>music box</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0d0d0d;
      color: #ccc;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .box {
      width: 320px;
      height: 200px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 8px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lid {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 40px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
    }
    .keys {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .key {
      width: 40px;
      height: 120px;
      background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
      border: 2px solid #333;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.05s, background 0.05s, box-shadow 0.05s;
      position: relative;
    }
    .key:active, .key.playing {
      transform: translateY(4px);
      background: linear-gradient(180deg, #3a3a3a 0%, #2a2a2a 100%);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
    }
    .key::after {
      content: attr(data-note);
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #888;
    }
    .crank {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 60px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .crank:active { transform: translateX(-50%) scale(0.95); }
    .crank.spinning { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: translateX(-50%) rotate(0deg); } to { transform: translateX(-50%) rotate(360deg); } }
    .crank::before {
      content: '';
      width: 16px;
      height: 16px;
      border: 3px solid #555;
      border-radius: 50%;
      border-top-color: #aaa;
    }
    .status { margin-top: 24px; font-size: 13px; color: #888; min-height: 18px; }
    .loops { margin-top: 8px; font-size: 12px; color: #666; }
    .tension {
      margin-top: 16px;
      width: 320px;
      height: 60px;
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .tension-bar {
      position: absolute;
      bottom: 0;
      width: 20px;
      transition: height 0.3s ease, background 0.3s ease;
      border-radius: 2px 2px 0 0;
    }
    .tension-label {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      color: #666;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="lid"></div>
    <div class="keys">
      <div class="key" data-note="C" data-freq="261.63"></div>
      <div class="key" data-note="E" data-freq="329.63"></div>
      <div class="key" data-note="G" data-freq="392.00"></div>
      <div class="key" data-note="C'" data-freq="523.25"></div>
    </div>
    <div class="crank" id="crank"></div>
  </div>
  <div class="status" id="status">click crank to wind</div>
  <div class="loops" id="loops">loops: 0</div>
  <div class="tension" id="tension">
    <div class="tension-bar" id="t0" style="left: 10px;" data-note="C"><div class="tension-label">C</div></div>
    <div class="tension-bar" id="t1" style="left: 90px;" data-note="E"><div class="tension-label">E</div></div>
    <div class="tension-bar" id="t2" style="left: 170px;" data-note="G"><div class="tension-label">G</div></div>
    <div class="tension-bar" id="t3" style="left: 250px;" data-note="C'"><div class="tension-label">C'</div></div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const keys = document.querySelectorAll('.key');
    const crank = document.getElementById('crank');
    const status = document.getElementById('status');
    const loopsEl = document.getElementById('loops');
    const tensionBars = document.querySelectorAll('.tension-bar');
    
    let isPlaying = false;
    let stopRequested = false;
    let loopCount = 0;
    
    // each note gets its own drifting personality
    const noteState = [
      { detune: 0, velocity: 1, timing: 0, driftDir: 1, tension: 0 },
      { detune: 0, velocity: 1, timing: 0, driftDir: -1, tension: 0 },
      { detune: 0, velocity: 1, timing: 0, driftDir: 1, tension: 0 },
      { detune: 0, velocity: 1, timing: 0, driftDir: -1, tension: 0 }
    ];
    
    function playNote(freq, duration, state, index) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      // apply accumulated detune (in cents)
      const actualFreq = freq * Math.pow(2, state.detune / 1200);
      osc.frequency.value = actualFreq;
      osc.type = 'triangle';
      
      gain.gain.value = 0;
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.15 * state.velocity, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
      
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration / 1000 + 0.1);
      
      return new Promise(r => setTimeout(r, duration));
    }
    
    function highlightKey(i) {
      keys[i].classList.add('playing');
      setTimeout(() => keys[i].classList.remove('playing'), 150);
    }
    
    function updateTensionBars() {
      noteState.forEach((s, i) => {
        const h = Math.min(50, Math.abs(s.tension) * 2);
        tensionBars[i].style.height = h + 'px';
        tensionBars[i].style.background = s.tension > 0 ? '#e74c3c' : '#3498db';
      });
    }
    
    async function playSequence() {
      const baseFreqs = [261.63, 329.63, 392.00, 523.25];
      const baseDuration = 400;
      
      for (let i = 0; i < 4; i++) {
        if (stopRequested) return false;
        
        const state = noteState[i];
        
        // timing drift - some rush, some drag
        const timingOffset = state.timing * 50; // ms
        if (timingOffset > 0) await new Promise(r => setTimeout(r, timingOffset));
        
        highlightKey(i);
        await playNote(baseFreqs[i], baseDuration + state.timing * 20, state, i);
        
        if (stopRequested) return false;
        
        // small gap between notes, but affected by timing drift
        await new Promise(r => setTimeout(r, 80 - timingOffset));
      }
      return true;
    }
    
    function evolveNotes() {
      noteState.forEach((s, i) => {
        // detune drifts - they fight to stay in tune or pull away
        s.detune += s.driftDir * (0.5 + Math.random() * 1.5); // cents per loop
        
        // if detune gets too extreme, they fight back
        if (Math.abs(s.detune) > 50) {
          s.driftDir *= -1;
          s.tension += s.driftDir * 5;
        }
        
        // velocity fights - some get louder, some quieter
        s.velocity += s.driftDir * 0.02;
        s.velocity = Math.max(0.3, Math.min(1.5, s.velocity));
        
        // timing fights - rush vs drag
        s.timing += s.driftDir * 0.015;
        s.timing = Math.max(-0.8, Math.min(0.8, s.timing));
        
        // tension accumulates when they're fighting
        s.tension *= 0.95; // slow decay
        s.tension += (Math.random() - 0.5) * 2;
      });
      
      // cross-influence: notes affect each other
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
          if (i !== j) {
            // pull toward each other slightly (harmonic gravity)
            noteState[i].detune += (noteState[j].detune - noteState[i].detune) * 0.001;
          }
        }
      }
      
      updateTensionBars();
    }
    
    async function runLoops() {
      crank.classList.add('spinning');
      status.textContent = 'playing... click crank to stop';
      
      while (!stopRequested) {
        const completed = await playSequence();
        if (!completed) break;
        
        loopCount++;
        loopsEl.textContent = `loops: ${loopCount}`;
        
        evolveNotes();
        
        if (stopRequested) break;
        await new Promise(r => setTimeout(r, 200));
      }
      
      crank.classList.remove('spinning');
      status.textContent = stopRequested ? 'stopped. click to wind again' : 'finished';
      stopRequested = false;
      isPlaying = false;
    }
    
    crank.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      if (isPlaying) {
        stopRequested = true;
      } else {
        isPlaying = true;
        stopRequested = false;
        loopCount = 0;
        loopsEl.textContent = 'loops: 0';
        // reset note states
        noteState.forEach((s, i) => {
          s.detune = 0;
          s.velocity = 1;
          s.timing = 0;
          s.driftDir = i % 2 === 0 ? 1 : -1;
          s.tension = 0;
        });
        updateTensionBars();
        runLoops();
      }
    });
    
    keys.forEach((key, i) => {
      key.addEventListener('click', () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const freq = parseFloat(key.dataset.freq);
        highlightKey(i);
        playNote(freq, 800, noteState[i], i);
      });
    });
  </script>
</body>
</html>
