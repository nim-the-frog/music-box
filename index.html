<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>music box</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0d0d0d;
      color: #ccc;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .box {
      width: 320px;
      height: 200px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .lid {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 40px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
    }
    .crank {
      width: 60px;
      height: 60px;
      border: 3px solid #444;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      transition: transform 0.1s;
      margin-bottom: 20px;
    }
    .crank::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border: 3px solid #444;
      border-radius: 50%;
    }
    .crank::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 25px;
      background: #444;
      border-radius: 4px;
    }
    .crank.spinning {
      animation: spin 1s linear infinite;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .keys {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: auto;
    }
    .key {
      width: 40px;
      height: 120px;
      background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
      border: 2px solid #333;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.05s, background 0.1s;
      position: relative;
    }
    .key:active { transform: translateY(4px); }
    .key.playing {
      background: linear-gradient(180deg, #4a4a4a 0%, #3a3a3a 100%);
      border-color: #666;
    }
    .key::after {
      content: attr(data-note);
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #888;
    }
    .status {
      margin-top: 16px;
      font-size: 13px;
      color: #888;
      text-align: center;
      min-height: 20px;
    }
    .loops {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    .tension-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
      height: 60px;
      align-items: flex-end;
    }
    .tension-bar {
      width: 40px;
      height: 100%;
      background: #222;
      border: 1px solid #333;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }
    .tension-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(0deg, #e84 0%, #fa0 50%, #4f4 100%);
      transition: height 0.1s;
    }
    .tension-label {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: #666;
      white-space: nowrap;
    }
    .drift-info {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      font-size: 11px;
      color: #555;
    }
    .drift-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .drift-value {
      font-family: monospace;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="lid"></div>
    <div class="crank" id="crank"></div>
    <div class="keys">
      <div class="key" data-note="C3" data-freq="130.81"></div>
      <div class="key" data-note="E3" data-freq="164.81"></div>
      <div class="key" data-note="G3" data-freq="196.00"></div>
      <div class="key" data-note="C4" data-freq="261.63"></div>
    </div>
  </div>
  <div class="status" id="status">click the crank to wind</div>
  <div class="loops" id="loops">loops: 0</div>
  <div class="tension-container" id="tension"></div>
  <div class="drift-info" id="drift"></div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const crank = document.getElementById('crank');
    const keys = document.querySelectorAll('.key');
    const status = document.getElementById('status');
    const loopsEl = document.getElementById('loops');
    const tensionContainer = document.getElementById('tension');
    const driftEl = document.getElementById('drift');

    let isPlaying = false;
    let stopRequested = false;
    let loopCount = 0;

    const noteState = [
      { detune: 0, velocity: 1, timing: 0, driftDir: 1, tension: 0, name: 'C3' },
      { detune: 0, velocity: 1, timing: 0, driftDir: -1, tension: 0, name: 'E3' },
      { detune: 0, velocity: 1, timing: 0, driftDir: 1, tension: 0, name: 'G3' },
      { detune: 0, velocity: 1, timing: 0, driftDir: -1, tension: 0, name: 'C4' }
    ];

    function buildTensionBars() {
      tensionContainer.innerHTML = '';
      noteState.forEach((s, i) => {
        const bar = document.createElement('div');
        bar.className = 'tension-bar';
        bar.innerHTML = `
          <div class="tension-fill" id="tension-fill-${i}" style="height: 0%"></div>
          <div class="tension-label">${s.name}</div>
        `;
        tensionContainer.appendChild(bar);
      });
    }

    function updateTensionBars() {
      noteState.forEach((s, i) => {
        const fill = document.getElementById(`tension-fill-${i}`);
        if (fill) fill.style.height = `${Math.min(s.tension * 100, 100)}%`;
      });
    }

    function updateDriftInfo() {
      driftEl.innerHTML = noteState.map((s, i) => `
        <div class="drift-item">
          <span>${s.name}</span>
          <span class="drift-value">detune: ${s.detune.toFixed(1)}¢</span>
          <span class="drift-value">vel: ${s.velocity.toFixed(2)}</span>
          <span class="drift-value">time: ${(s.timing * 1000).toFixed(1)}ms</span>
          <span class="drift-value">tension: ${(s.tension * 100).toFixed(0)}%</span>
        </div>
      `).join('');
    }

    function playNote(freq, duration, state, index) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq * Math.pow(2, state.detune / 1200);
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      const attack = 0.01;
      const decay = duration / 1000 * 0.8;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(state.velocity * 0.3, now + attack);
      gain.gain.exponentialRampToValueAtTime(0.001, now + attack + decay);

      osc.start(now);
      osc.stop(now + attack + decay + 0.1);

      keys[index].classList.add('playing');
      setTimeout(() => keys[index].classList.remove('playing'), duration);
    }

    function highlightKey(index) {
      keys[index].classList.add('playing');
      setTimeout(() => keys[index].classList.remove('playing'), 200);
    }

    function evolveNotes() {
      noteState.forEach((s, i) => {
        const otherNotes = noteState.filter((_, j) => j !== i);
        let push = 0;
        otherNotes.forEach(o => {
          const diff = s.detune - o.detune;
          push += diff * 0.02;
        });

        s.detune += (Math.random() - 0.5) * 8 + s.driftDir * 1.5 - push;
        s.detune = Math.max(-200, Math.min(200, s.detune));

        s.velocity *= 0.995;
        s.velocity += (Math.random() - 0.5) * 0.02;
        s.velocity = Math.max(0.1, Math.min(2, s.velocity));

        s.timing += (Math.random() - 0.5) * 0.008;
        s.timing = Math.max(-0.15, Math.min(0.15, s.timing));

        const avgDetune = noteState.reduce((a, n) => a + Math.abs(n.detune), 0) / noteState.length;
        s.tension = Math.min(1, avgDetune / 100);

        if (Math.random() < 0.02) s.driftDir *= -1;
      });
    }

    async function runLoops() {
      crank.classList.add('spinning');
      status.textContent = 'winding...';

      while (!stopRequested) {
        loopCount++;
        loopsEl.textContent = `loops: ${loopCount}`;
        status.textContent = `loop ${loopCount} — let them fight`;

        for (let i = 0; i < 4; i++) {
          if (stopRequested) break;
          const freq = parseFloat(keys[i].dataset.freq);
          const state = noteState[i];
          const delay = (i * 500) + state.timing * 1000;
          await new Promise(r => setTimeout(r, delay));
          if (stopRequested) break;
          highlightKey(i);
          playNote(freq, 800, state, i);
        }

        evolveNotes();
        updateTensionBars();
        updateDriftInfo();

        if (stopRequested) break;
        await new Promise(r => setTimeout(r, 400));
      }

      crank.classList.remove('spinning');
      status.textContent = stopRequested ? 'stopped. click to wind again' : 'finished';
      stopRequested = false;
      isPlaying = false;
    }

    buildTensionBars();
    updateDriftInfo();

    crank.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (isPlaying) {
        stopRequested = true;
      } else {
        isPlaying = true;
        stopRequested = false;
        loopCount = 0;
        loopsEl.textContent = 'loops: 0';
        noteState.forEach((s, i) => {
          s.detune = 0;
          s.velocity = 1;
          s.timing = 0;
          s.driftDir = i % 2 === 0 ? 1 : -1;
          s.tension = 0;
        });
        updateTensionBars();
        updateDriftInfo();
        runLoops();
      }
    });

    keys.forEach((key, i) => {
      key.addEventListener('click', () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const freq = parseFloat(key.dataset.freq);
        highlightKey(i);
        playNote(freq, 800, noteState[i], i);
      });
    });
  </script>
</body>
</html>
