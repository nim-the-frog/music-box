<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>simulate13 music box</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      color: #ccc;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .box {
      width: 400px;
      height: 280px;
      background: #121212;
      border: 2px solid #2a2a2a;
      border-radius: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .lid {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 50px;
      background: #121212;
      border: 2px solid #2a2a2a;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
    }
    .crank {
      width: 70px;
      height: 70px;
      border: 3px solid #333;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      transition: transform 0.1s;
      margin-bottom: 15px;
    }
    .crank::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 18px;
      height: 18px;
      background: #444;
      border-radius: 50%;
    }
    .crank::after {
      content: '';
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 28px;
      background: #444;
      border-radius: 6px;
    }
    .crank.spinning {
      animation: spin 1s linear infinite;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .voice-bars {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      width: 100%;
      justify-content: center;
    }
    .voice-bar {
      width: 60px;
      height: 120px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 8px;
    }
    .voice-bar .label {
      font-size: 10px;
      color: #888;
      margin-bottom: 4px;
    }
    .voice-bar .fill {
      width: 80%;
      background: linear-gradient(to top, #4a9, #8cf);
      border-radius: 2px;
      transition: height 0.1s, background 0.1s;
      position: relative;
    }
    .voice-bar .cycle-num {
      position: absolute;
      bottom: 4px;
      font-size: 9px;
      color: #666;
    }
    .tension-bar {
      width: 80%;
      height: 12px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      margin-top: 12px;
      overflow: hidden;
      position: relative;
    }
    .tension-bar .fill {
      height: 100%;
      background: linear-gradient(to right, #244, #488, #8cc);
      border-radius: 5px;
      transition: width 0.1s;
    }
    .tension-bar .markers {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
    }
    .tension-bar .marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(255,255,255,0.15);
    }
    .cycles-info {
      font-size: 11px;
      color: #888;
      margin-top: 8px;
      text-align: center;
    }
    .status {
      font-size: 12px;
      color: #aaa;
      margin-top: 16px;
      text-align: center;
      min-height: 18px;
    }
    h1 { font-size: 14px; font-weight: normal; color: #666; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>simulate13 music box</h1>
  <div class="box">
    <div class="lid"></div>
    <div class="crank" id="crank"></div>
    <div class="voice-bars" id="voiceBars"></div>
    <div class="tension-bar" id="tensionBar">
      <div class="fill" id="tensionFill"></div>
      <div class="markers" id="tensionMarkers"></div>
    </div>
    <div class="cycles-info" id="cyclesInfo"></div>
    <div class="status" id="status">click crank to wind</div>
  </div>

  <script src="simulate13-voices.js"></script>
  <script>
const NOTES = 8;
const VOICE_CYCLES = SIM13_VOICES;
const ALL_CYCLES = SIM13_CYCLES;

let noteState = [];
for (let i = 0; i < NOTES; i++) {
  noteState.push({
    detune: 0,
    velocity: 1,
    timing: 0,
    driftDir: i % 2 === 0 ? 1 : -1,
    tension: 0
  });
}

let cycleIndex = 0;
let voiceCycleIndex = [0, 0, 0, 0];
let currentVoiceCycles = VOICE_CYCLES.map(v => v[0] || 1000);
let stepsInCurrentCycle = 0;
let tensionHistory = [];

const crank = document.getElementById('crank');
const status = document.getElementById('status');
let isPlaying = false;
let stopRequested = false;
let audioCtx = null;
let oscillators = [];
let gainNodes = [];

function buildVoiceBars() {
  const container = document.getElementById('voiceBars');
  container.innerHTML = '';
  VOICE_CYCLES.forEach((cycles, v) => {
    const bar = document.createElement('div');
    bar.className = 'voice-bar';
    bar.innerHTML = `
      <div class="label">voice ${v+1}</div>
      <div class="fill" id="voiceFill${v}" style="height: 0%"></div>
      <div class="cycle-num" id="voiceCycle${v}">${cycles[0]}</div>
    `;
    container.appendChild(bar);
  });
  // tension markers
  const markers = document.getElementById('tensionMarkers');
  markers.innerHTML = '';
  ALL_CYCLES.forEach((c, i) => {
    const m = document.createElement('div');
    m.className = 'marker';
    m.style.left = `${(c / Math.max(...ALL_CYCLES)) * 100}%`;
    m.title = `cycle ${i+1}: ${c}`;
    markers.appendChild(m);
  });
}

function updateVoiceBars(voices) {
  voices.forEach((v, i) => {
    const fill = document.getElementById(`voiceFill${i}`);
    const cycleNum = document.getElementById(`voiceCycle${i}`);
    if (fill) fill.style.height = `${v.level * 100}%`;
    if (cycleNum) cycleNum.textContent = v.cycle;
  });
}

function updateTensionBar(voices) {
  const fill = document.getElementById('tensionFill');
  const avgTension = voices.reduce((a, v) => a + v.tension, 0) / voices.length;
  fill.style.width = `${avgTension * 100}%`;
}

function updateCyclesInfo() {
  const info = document.getElementById('cyclesInfo');
  info.textContent = `cycle ${cycleIndex + 1}/${ALL_CYCLES.length} | voices: ${voiceCycleIndex.map((vi, i) => `${vi+1}/${VOICE_CYCLES[i].length}`).join(', ')}`;
}

function getVoiceData() {
  return VOICE_CYCLES.map((cycles, v) => {
    const idx = voiceCycleIndex[v] % cycles.length;
    const cycleLen = cycles[idx];
    const progress = stepsInCurrentCycle / cycleLen;
    const noteIdx = v * 2;
    const tension = Math.min(1, noteState[noteIdx]?.tension || 0);
    return {
      cycle: cycleLen,
      level: progress,
      tension: tension,
      freq: noteState[noteIdx] ? 110 * Math.pow(2, (noteState[noteIdx].detune || 0)/100) : 110
    };
  });
}

function evolveNotes() {
  stepsInCurrentCycle++;
  
  // check if any voice cycle completes
  let anyComplete = false;
  VOICE_CYCLES.forEach((cycles, v) => {
    const idx = voiceCycleIndex[v] % cycles.length;
    if (stepsInCurrentCycle >= cycles[idx]) {
      voiceCycleIndex[v] = (voiceCycleIndex[v] + 1) % cycles.length;
      anyComplete = true;
    }
  });
  
  if (anyComplete) {
    stepsInCurrentCycle = 0;
    cycleIndex = (cycleIndex + 1) % ALL_CYCLES.length;
  }
  
  // evolve each note
  noteState.forEach((s, i) => {
    // gentle detune drift
    s.detune += s.driftDir * (0.05 + Math.random() * 0.1);
    if (Math.abs(s.detune) > 50) s.driftDir *= -1;
    
    // tension buildup based on voice cycle position
    const voiceIdx = Math.floor(i / 2);
    const cycles = VOICE_CYCLES[voiceIdx];
    const idx = voiceCycleIndex[voiceIdx] % cycles.length;
    const cycleLen = cycles[idx];
    const cycleProgress = stepsInCurrentCycle / cycleLen;
    
    s.tension = 0.1 + 0.8 * cycleProgress * (1 + 0.3 * Math.sin(stepsInCurrentCycle * 0.1));
    s.tension = Math.min(1, Math.max(0, s.tension));
    
    // velocity affected by tension
    s.velocity = 1 - s.tension * 0.3;
  });
}

async function startOscillators(voices) {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  
  // stop old
  oscillators.forEach(o => { try { o.stop(); } catch(e) {} });
  oscillators = [];
  gainNodes = [];
  
  voices.forEach((v, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = v.freq;
    gain.gain.value = 0.08 * v.level * (1 - v.tension * 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    oscillators.push(osc);
    gainNodes.push(gain);
  });
}

function stopOscillators() {
  oscillators.forEach(o => { try { o.stop(); } catch(e) {} });
  oscillators = [];
  gainNodes = [];
}

async function runLoop() {
  while (isPlaying && !stopRequested) {
    evolveNotes();
    const voices = getVoiceData();
    
    updateVoiceBars(voices);
    updateTensionBar(voices);
    updateCyclesInfo();
    
    if (audioCtx) {
      startOscillators(voices);
    }
    
    await new Promise(r => setTimeout(r, 50));
  }
  
  stopOscillators();
  crank.classList.remove('spinning');
  status.textContent = stopRequested ? 'stopped. click to wind again' : 'finished';
  isPlaying = false;
  stopRequested = false;
}

buildVoiceBars();
updateCyclesInfo();

crank.addEventListener('click', () => {
  if (isPlaying) {
    stopRequested = true;
  } else {
    isPlaying = true;
    stopRequested = false;
    noteState.forEach((s, i) => {
      s.detune = 0;
      s.velocity = 1;
      s.timing = 0;
      s.driftDir = i % 2 === 0 ? 1 : -1;
      s.tension = 0;
    });
    cycleIndex = 0;
    voiceCycleIndex = [0, 0, 0, 0];
    currentVoiceCycles = VOICE_CYCLES.map(v => v[0] || 1000);
    stepsInCurrentCycle = 0;
    tensionHistory.length = 0;
    updateVoiceBars(getVoiceData());
    updateTensionBar(getVoiceData());
    updateCyclesInfo();
    crank.classList.add('spinning');
    status.textContent = 'playing... click to stop';
    runLoop();
  }
});
  </script>
</body>
</html>
