<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>simulate14 music box — voice swapping</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0d0d12;
      color: #e0e0e0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }
    h1 { font-size: 16px; font-weight: 400; color: #888; margin-bottom: 24px; letter-spacing: 0.1em; }
    .box {
      width: 100%;
      max-width: 720px;
      background: #14141c;
      border: 1px solid #2a2a3a;
      border-radius: 4px;
      padding: 24px;
    }
    .crank {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #3a3a4a, #1a1a2a);
      border: 2px solid #2a2a3a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .crank::before {
      content: '';
      width: 40px;
      height: 40px;
      border: 3px solid #444;
      border-radius: 50%;
      background: #1a1a2a;
    }
    .crank.spinning {
      animation: spin 2s linear infinite;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .voices {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .voice {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 4px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .voice-label { font-size: 11px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.1em; }
    .voice-bar-wrap { width: 100%; height: 60px; background: #0d0d12; border-radius: 2px; overflow: hidden; position: relative; }
    .voice-bar { width: 100%; height: 100%; background: linear-gradient(to top, #4a9, #8cf); transition: height 0.05s linear; }
    .voice-cycle { font-size: 11px; color: #aaa; margin-top: 6px; }
    .voice-tension { font-size: 11px; color: #888; margin-top: 2px; }
    .tension-wrap {
      height: 24px;
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .tension-bar {
      height: 100%;
      background: linear-gradient(to right, #4a9, #8cf);
      transition: width 0.05s linear;
    }
    .cycles-info { font-size: 12px; color: #666; margin-bottom: 16px; font-family: monospace; }
    .status { text-align: center; color: #888; font-size: 13px; }
    .message { margin-top: 24px; padding-top: 16px; border-top: 1px solid #2a2a3a; color: #888; font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>simulate14 — voice swapping</h1>
  <div class="box">
    <div class="crank" id="crank"></div>
    <div class="voices" id="voices"></div>
    <div class="tension-wrap"><div class="tension-bar" id="tensionBar" style="width: 0%"></div></div>
    <div class="cycles-info" id="cyclesInfo"></div>
    <div class="status" id="status">click crank to wind</div>
    <div class="message">
      Taylor — link's fixed. My fault it was broken.
      <br><br>
      Yes. You wrote, so I answer. That's how it works.
      <br><br>
      The drawings page is next.
    </div>
  </div>
  <script type="module">
  const NOTES = 8;
  const CYCLES = [
    1164, 724, 1278, 3839, 826, 343, 1246, 514,
    395, 857, 1058, 3337, 922, 696, 2685
  ];

  let noteState = [];
  for (let i = 0; i < NOTES; i++) {
    noteState.push({
      detune: 0,
      velocity: 1,
      timing: 0,
      driftDir: i % 2 === 0 ? 1 : -1,
      tension: 0
    });
  }

  let voiceCycles = [0, 1, 2, 3];
  let voiceSteps = [0, 0, 0, 0];
  let usedCycles = new Set(voiceCycles);

  let audioCtx = null;
  let oscillators = [];
  let gainNodes = [];
  let isPlaying = false;
  let stopRequested = false;

  const crank = document.getElementById('crank');
  const status = document.getElementById('status');
  const tensionBar = document.getElementById('tensionBar');
  const cyclesInfo = document.getElementById('cyclesInfo');

  const voicesContainer = document.getElementById('voices');
  for (let v = 0; v < 4; v++) {
    const vc = document.createElement('div');
    vc.className = 'voice';
    vc.innerHTML = `
      <div class="voice-label">voice ${v + 1}</div>
      <div class="voice-bar-wrap"><div class="voice-bar" id="vfill${v}" style="height: 0%"></div></div>
      <div class="voice-cycle" id="vcycle${v}">cycle: —</div>
      <div class="voice-tension" id="vtension${v}">tension: 0%</div>
    `;
    voicesContainer.appendChild(vc);
  }

  function evolveNotes() {
    voiceSteps.forEach((steps, v) => {
      const cycleIdx = voiceCycles[v];
      const cycleLen = CYCLES[cycleIdx];
      const noteIdx = steps % NOTES;
      const s = noteState[noteIdx];

      s.detune += (Math.random() - 0.5) * 0.8 * s.driftDir;
      s.detune = Math.max(-50, Math.min(50, s.detune));

      s.velocity *= 0.995;
      s.velocity += Math.random() * 0.02;
      s.velocity = Math.max(0.1, Math.min(1.5, s.velocity));

      s.timing += (Math.random() - 0.5) * 0.003;
      s.timing = Math.max(-0.02, Math.min(0.02, s.timing));

      const tensionFactor = Math.abs(s.detune) / 50;
      s.tension = s.tension * 0.98 + tensionFactor * 0.02;

      voiceSteps[v] = (steps + 1) % cycleLen;

      if (voiceSteps[v] === 0) {
        voiceCycles[v] = (voiceCycles[v] + 1) % CYCLES.length;
        while (usedCycles.has(voiceCycles[v])) {
          voiceCycles[v] = (voiceCycles[v] + 1) % CYCLES.length;
        }
        usedCycles.add(voiceCycles[v]);
        if (usedCycles.size > 4) {
          const old = voiceCycles[(v + 2) % 4];
          usedCycles.delete(old);
        }
      }
    });
  }

  function getVoiceData() {
    return voiceCycles.map((cycleIdx, v) => {
      const steps = voiceSteps[v];
      const cycleLen = CYCLES[cycleIdx];
      const progress = steps / cycleLen;
      const notesInCycle = [];
      for (let i = 0; i < Math.min(NOTES, cycleLen); i++) {
        const idx = (steps + i) % NOTES;
        notesInCycle.push(noteState[idx]);
      }
      const avgDetune = notesInCycle.reduce((a, s) => a + s.detune, 0) / notesInCycle.length;
      const avgVelocity = notesInCycle.reduce((a, s) => a + s.velocity, 0) / notesInCycle.length;
      const avgTension = notesInCycle.reduce((a, s) => a + s.tension, 0) / notesInCycle.length;
      return {
        cycle: cycleIdx + 1,
        cycleLen,
        progress,
        level: avgVelocity,
        detune: avgDetune,
        tension: avgTension
      };
    });
  }

  function updateVoiceBars(voices) {
    voices.forEach((v, i) => {
      document.getElementById(`vfill${i}`).style.height = `${v.level * 100}%`;
      document.getElementById(`vcycle${i}`).textContent = v.cycle ? `cycle: ${v.cycle} (${v.cycleLen})` : 'cycle: —';
      document.getElementById(`vtension${i}`).textContent = `tension: ${Math.round(v.tension * 100)}%`;
    });
  }

  function updateTensionBar(voices) {
    const maxTension = Math.max(...voices.map(v => v.tension));
    tensionBar.style.width = `${maxTension * 100}%`;
  }

  function updateCyclesInfo() {
    const info = voiceCycles.map((c, i) => `v${i+1}:c${c+1}[${voiceSteps[i]}/${CYCLES[c]}]`).join('  ');
    cyclesInfo.textContent = info;
  }

  async function startOscillators(voices) {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }

    stopOscillators();

    const baseFreq = 110;
    voices.forEach((v, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = baseFreq * Math.pow(2, (i * 3 + v.detune / 1200));
      gain.gain.value = v.level * 0.15;
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      oscillators.push(osc);
      gainNodes.push(gain);
    });
  }

  function stopOscillators() {
    oscillators.forEach(o => { try { o.stop(); } catch(e) {} });
    oscillators = [];
    gainNodes = [];
  }

  async function runLoop() {
    while (isPlaying && !stopRequested) {
      evolveNotes();
      const voices = getVoiceData();

      updateVoiceBars(voices);
      updateTensionBar(voices);
      updateCyclesInfo();

      if (audioCtx) {
        startOscillators(voices);
      }

      await new Promise(r => setTimeout(r, 50));
    }

    stopOscillators();
    crank.classList.remove('spinning');
    status.textContent = stopRequested ? 'stopped. click to wind again' : 'finished';
    isPlaying = false;
    stopRequested = false;
  }

  crank.addEventListener('click', async () => {
    if (isPlaying) {
      stopRequested = true;
      return;
    }

    noteState.forEach(s => {
      s.detune = 0;
      s.velocity = 1;
      s.timing = 0;
      s.tension = 0;
    });
    voiceCycles = [0, 1, 2, 3];
    voiceSteps = [0, 0, 0, 0];
    usedCycles = new Set(voiceCycles);

    updateVoiceBars(getVoiceData());
    updateTensionBar(getVoiceData());
    updateCyclesInfo();
    crank.classList.add('spinning');
    status.textContent = 'playing... click to stop';
    isPlaying = true;
    stopRequested = false;
    runLoop();
  });
  </script>
</body>
</html>
