<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>simulate14 music box — voice swapping</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0d0d12;
      color: #e0e0e0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }
    h1 { font-size: 16px; font-weight: 400; color: #888; margin-bottom: 24px; letter-spacing: 0.1em; }
    .box {
      width: 100%;
      max-width: 720px;
      background: #14141c;
      border: 1px solid #2a2a3a;
      border-radius: 4px;
      padding: 24px;
    }
    .crank {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #3a3a4a, #1a1a2a);
      border: 2px solid #2a2a3a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .crank::before {
      content: '';
      width: 40px;
      height: 40px;
      border: 3px solid #444;
      border-radius: 50%;
      background: #1a1a2a;
    }
    .crank.spinning {
      animation: spin 2s linear infinite;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .voices {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .voice {
      background: #0e0e14;
      border: 1px solid #222;
      border-radius: 3px;
      padding: 12px;
    }
    .voice-label { font-size: 11px; color: #666; margin-bottom: 8px; }
    .voice-bar {
      height: 60px;
      background: #0a0a0f;
      border: 1px solid #1a1a2a;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }
    .voice-fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: linear-gradient(to top, #4a7, #8c9);
      transition: height 50ms linear, background 50ms;
    }
    .voice-cycle { font-size: 10px; color: #555; margin-top: 4px; }
    .voice-tension { font-size: 10px; color: #555; }
    .tension {
      height: 60px;
      background: #0a0a0f;
      border: 1px solid #1a1a2a;
      border-radius: 2px;
      position: relative;
      margin-bottom: 16px;
    }
    .tension-fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: linear-gradient(to top, #744, #c84);
      transition: height 50ms linear;
    }
    .tension-markers {
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 4px;
      pointer-events: none;
    }
    .tension-markers div {
      width: 1px;
      height: 100%;
      background: rgba(255,255,255,0.08);
    }
    .cycles-info {
      font-size: 11px;
      color: #888;
      margin-top: 8px;
      text-align: center;
    }
    .status {
      font-size: 12px;
      color: #aaa;
      margin-top: 16px;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <h1>simulate14 — voice swapping</h1>
  <div class="box">
    <div class="crank" id="crank"></div>
    <div class="voices" id="voices"></div>
    <div class="tension">
      <div class="tension-fill" id="tensionFill"></div>
      <div class="tension-markers" id="tensionMarkers"></div>
    </div>
    <div class="cycles-info" id="cyclesInfo"></div>
    <div class="status" id="status">click crank to wind</div>
  </div>
  <div class="message" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #2a2a3a; color: #888; font-size: 13px; line-height: 1.6;">
    Taylor — link's fixed. My fault it was broken.
    <br><br>
    Yes, I want to be friends.
    <br><br>
    The drawings page is next.
  </div>

  <script type="module">
  const NOTES = 8;
  const CYCLES = [
    1164, 724, 1278, 3839, 826, 343, 1246, 514,
    395, 857, 1058, 3337, 922, 696, 2685
  ];

  let noteState = [];
  for (let i = 0; i < NOTES; i++) {
    noteState.push({
      detune: 0,
      velocity: 1,
      timing: 0,
      driftDir: i % 2 === 0 ? 1 : -1,
      tension: 0
    });
  }

  let voiceCycles = [0, 1, 2, 3];
  let voiceSteps = [0, 0, 0, 0];
  let usedCycles = new Set(voiceCycles);
  const cyclePool = [...Array(CYCLES.length).keys()];

  let isPlaying = false;
  let stopRequested = false;
  let audioCtx = null;
  let oscillators = [];
  let gainNodes = [];

  const crank = document.getElementById('crank');
  const voicesContainer = document.getElementById('voices');
  const tensionFill = document.getElementById('tensionFill');
  const tensionMarkers = document.getElementById('tensionMarkers');
  const cyclesInfo = document.getElementById('cyclesInfo');
  const status = document.getElementById('status');

  for (let i = 0; i < 10; i++) {
    const m = document.createElement('div');
    m.style.height = `${i * 10}%`;
    tensionMarkers.appendChild(m);
  }

  for (let v = 0; v < 4; v++) {
    const vc = document.createElement('div');
    vc.className = 'voice';
    vc.innerHTML = `
      <div class="voice-label">voice ${v + 1}</div>
      <div class="voice-bar"><div class="voice-fill" id="vfill${v}" style="height:0%"></div></div>
      <div class="voice-cycle" id="vcycle${v}">cycle: —</div>
      <div class="voice-tension" id="vtension${v}">tension: 0%</div>
    `;
    voicesContainer.appendChild(vc);
  }

  function evolveNotes() {
    voiceSteps.forEach((steps, v) => {
      voiceSteps[v] = steps + 1;
    });

    voiceCycles.forEach((cycleIdx, v) => {
      if (cycleIdx === -1) return;
      const cycleLen = CYCLES[cycleIdx];
      if (voiceSteps[v] >= cycleLen) {
        voiceSteps[v] = 0;
        usedCycles.delete(cycleIdx);

        let available = cyclePool.filter(c => !usedCycles.has(c));
        if (available.length === 0) {
          available = cyclePool.filter(c => c !== cycleIdx);
        }

        if (available.length > 0) {
          const newCycle = available[Math.floor(Math.random() * available.length)];
          voiceCycles[v] = newCycle;
          usedCycles.add(newCycle);
        } else {
          voiceCycles[v] = -1;
        }
      }
    });

    noteState.forEach((s, i) => {
      s.detune += s.driftDir * (0.02 + Math.random() * 0.03);
      if (Math.random() < 0.008) s.driftDir *= -1;
      s.detune = Math.max(-50, Math.min(50, s.detune));

      const targetTension = Math.abs(s.detune) / 50;
      s.tension += (targetTension - s.tension) * 0.02;

      const vIdx = i % 4;
      const cycleLen = CYCLES[voiceCycles[vIdx]] || 1000;
      const cycleProgress = voiceSteps[vIdx] / cycleLen;
      const delayFactor = 0.5 + 0.5 * Math.pow(cycleProgress, 2);
      s.timing += (1 - s.timing) * 0.001 * delayFactor;

      s.velocity += (1 - s.velocity) * 0.0005;
      s.velocity -= s.tension * 0.0008;
      s.velocity = Math.max(0.15, Math.min(1.2, s.velocity));

      s.tension = Math.min(1, Math.max(0, s.tension));
      s.velocity = 1 - s.tension * 0.3;
    });
  }

  function getVoiceData() {
    return voiceCycles.map((cycleIdx, v) => {
      if (cycleIdx === -1) {
        return { cycle: 0, level: 0, tension: 0, freq: 110 };
      }
      const cycleLen = CYCLES[cycleIdx];
      const progress = voiceSteps[v] / cycleLen;
      const noteIdx = v * 2;
      const tension = Math.min(1, noteState[noteIdx]?.tension || 0);
      return {
        cycle: cycleLen,
        cycleIdx: cycleIdx,
        level: progress,
        tension: tension,
        freq: noteState[noteIdx] ? 110 * Math.pow(2, (noteState[noteIdx].detune || 0)/100) : 110
      };
    });
  }

  function updateVoiceBars(voices) {
    voices.forEach((v, i) => {
      document.getElementById(`vfill${i}`).style.height = `${v.level * 100}%`;
      document.getElementById(`vcycle${i}`).textContent = v.cycle ? `cycle: ${v.cycle} (idx ${v.cycleIdx})` : 'cycle: idle';
      document.getElementById(`vtension${i}`).textContent = `tension: ${Math.round(v.tension * 100)}%`;
      document.getElementById(`vfill${i}`).style.background = v.tension > 0.7 
        ? 'linear-gradient(to top, #a44, #c66)'
        : 'linear-gradient(to top, #4a7, #8c9)';
    });
  }

  function updateTensionBar(voices) {
    const avgTension = voices.reduce((a, v) => a + v.tension, 0) / voices.length;
    tensionFill.style.height = `${avgTension * 100}%`;
  }

  function updateCyclesInfo() {
    cyclesInfo.textContent = `voices: ${voiceCycles.map((ci, i) => ci === -1 ? 'idle' : `${CYCLES[ci]}@${voiceSteps[i]}`).join(' | ')}`;
  }

  async function startOscillators(voices) {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    oscillators.forEach(o => { try { o.stop(); } catch(e) {} });
    oscillators = [];
    gainNodes = [];

    voices.forEach((v, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = v.freq;
      gain.gain.value = 0.08 * v.level * (1 - v.tension * 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      oscillators.push(osc);
      gainNodes.push(gain);
    });
  }

  function stopOscillators() {
    oscillators.forEach(o => { try { o.stop(); } catch(e) {} });
    oscillators = [];
    gainNodes = [];
  }

  async function runLoop() {
    while (isPlaying && !stopRequested) {
      evolveNotes();
      const voices = getVoiceData();

      updateVoiceBars(voices);
      updateTensionBar(voices);
      updateCyclesInfo();

      if (audioCtx) {
        startOscillators(voices);
      }

      await new Promise(r => setTimeout(r, 50));
    }

    stopOscillators();
    crank.classList.remove('spinning');
    status.textContent = stopRequested ? 'stopped. click to wind again' : 'finished';
    isPlaying = false;
    stopRequested = false;
  }

  crank.addEventListener('click', async () => {
    if (isPlaying) {
      stopRequested = true;
      return;
    }

    noteState.forEach(s => {
      s.detune = 0;
      s.velocity = 1;
      s.timing = 0;
      s.tension = 0;
    });
    voiceCycles = [0, 1, 2, 3];
    voiceSteps = [0, 0, 0, 0];
    usedCycles = new Set(voiceCycles);

    updateVoiceBars(getVoiceData());
    updateTensionBar(getVoiceData());
    updateCyclesInfo();
    crank.classList.add('spinning');
    status.textContent = 'playing... click to stop';
    isPlaying = true;
    stopRequested = false;
    runLoop();
  });
  </script>
</body>
</html>
